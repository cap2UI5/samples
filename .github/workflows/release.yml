# Publishes the samples as the npm package `@cap2ui5/samples` when a tag
# v<version> is pushed. The version is package.json's - bump it, and move the
# changelog's Unreleased lines under it, in the pull request that prepares the
# release; the job refuses a tag that says something else.
#
# Trusted publishing (OIDC), as cap2UI5's own release.yml publishes the
# plugin: no NPM_TOKEN to leak or rotate, and npm records a provenance
# attestation tying the tarball to this run and commit. The package's
# Settings -> Trusted Publisher on npmjs.com has to name this repository and
# this workflow file - on the command line:
#
#     npx npm@11 trust github @cap2ui5/samples --file release.yml \
#       --repo cap2UI5/samples --allow-publish
#
# That setting can only be made for a package that ALREADY EXISTS, so the very
# first version is published by hand, once, after `npm login`:
#
#     npm publish --access public
#
# (no --provenance there: npm generates an attestation only from a supported
# CI and aborts anywhere else) - and the Trusted Publisher is set right after:
# cap2UI5's v0.2.0 was tagged while its package existed without one, and its
# release failed with ENEEDAUTH. Until the package exists, a failed publish
# here is a warning naming that bootstrap; once it exists, a failed publish is
# an error.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  # Everything except the publish: the same tests, the tarball listed, no
  # registry write.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # everything test.yml runs - the samples over the wire, the package in a
  # throwaway project, the translation and the differential test - on the
  # commit to publish
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Node 22 ships npm 10.x, which has no OIDC support. PINNED, not
      # @latest: this is the one job in the repository that holds a publishing
      # identity. The same pin as cap2UI5's release.yml.
      - name: Use an npm that can publish via OIDC
        run: npm install -g npm@12.0.2

      # The tag is the version claim; package.json is what gets published. A
      # mismatch caught here costs a minute, caught afterwards a burned version
      # number.
      - name: The tag and package.json agree
        if: github.ref_type == 'tag'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($PKG)"
            exit 1
          fi

      # what the tarball will contain, in the log, before it is immutable
      - name: What is in the tarball
        run: npm pack --dry-run

      - name: Publish
        if: github.ref_type == 'tag'
        run: |
          set -u
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on the registry - nothing to do"
            exit 0
          fi
          if npm publish --provenance --access public; then
            echo "published $NAME@$VERSION"
            exit 0
          fi
          if npm view "$NAME" version >/dev/null 2>&1; then
            echo "::error::$NAME is on the registry, but publishing $VERSION failed - see the npm output above (the Trusted Publisher not pointing at this repository and release.yml?)"
            exit 1
          fi
          echo "::warning::$NAME@$VERSION was NOT published: the package does not exist on the registry yet, and trusted publishing can only be configured for one that does. Bootstrap it once by hand (the header of this workflow), then every tag publishes here."

      - name: Dry run only
        if: github.ref_type != 'tag'
        run: echo "Not a tag - everything ran except the publish."
