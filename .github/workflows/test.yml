name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Until cap2ui5 0.2.0 is on npm, the samples run against cap2UI5's main:
      # its plugin packed as `npm publish` packs it, and installed alone -
      # which brings the other dependencies along, as the README says for a
      # local checkout. Once 0.2.0 is published this goes, a package-lock.json
      # pins it, and `cache: npm` and npm ci come back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cap2UI5/cap2UI5
          path: .cap2ui5
          persist-credentials: false
      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: .cap2ui5/plugin
      - run: npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/cap2ui5-*.tgz
      - run: npm test
