name: test

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs all of this on the tagged commit before it publishes
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The plugin from npm, in the version the peer dependency names - what a
      # project that adds the samples runs them on. No lockfile, as in
      # cap2UI5: the run tests what an install gets today.
      - run: npm install --no-audit --no-fund
      - run: npm test

      # ---- the package: packed as publish packs it, installed into a
      # throwaway CAP project beside an app of its own, and served
      - run: npm run consumer-test

      # ---- the translation: srv/apps is what abap2js makes of the pinned samples
      - id: pin
        run: echo "sha=$(cat ABAP2UI5_SAMPLES_PIN)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abap2UI5/samples
          ref: ${{ steps.pin.outputs.sha }}
          path: .abap2UI5-samples
          persist-credentials: false
      - name: srv/apps is what abap2js makes of the pinned samples
        run: node scripts/generate.mjs --check --samples .abap2UI5-samples
      # every sample beside its transpiled ABAP original, roundtrip for roundtrip
      - name: the samples behave as their ABAP originals
        run: |
          node scripts/originals.mjs --samples .abap2UI5-samples
          node --test test/differential.mjs
